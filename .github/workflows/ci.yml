name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run VS Code end-to-end tests
        run: >-
          xvfb-run -a npm run test:e2e --
          --storage "$RUNNER_TEMP/test-resources"
          --extensions_dir "$RUNNER_TEMP/test-resources/extensions"

      - name: Verify VSIX package
        run: npm run package:vsix
