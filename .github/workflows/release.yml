name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run VS Code end-to-end tests
        run: >-
          xvfb-run -a npm run test:e2e --
          --storage "$RUNNER_TEMP/test-resources"
          --extensions_dir "$RUNNER_TEMP/test-resources/extensions"

      - name: Package VSIX
        run: npm run package:vsix

      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node

      - name: Publish to Visual Studio Marketplace
        if: ${{ steps.release.outputs.release_created }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm exec -- vsce publish --packagePath markdown-preview-table-sort.vsix

      - name: Attach VSIX to GitHub Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" markdown-preview-table-sort.vsix --clobber
